name: Import TimeLens source archive

on:
  push:
    branches: [main]
    paths: [TimeLens-source.zip]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timelens-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract validated source archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          root = Path.cwd().resolve()
          archive_path = root / 'TimeLens-source.zip'
          if not archive_path.is_file():
              raise SystemExit('Upload TimeLens-source.zip to the repository root first.')

          blocked = {'.git', 'node_modules', '.sites-runtime', '.wrangler', '.deploy', 'dist'}
          with zipfile.ZipFile(archive_path) as archive:
              infos = archive.infolist()
              if len(infos) > 1000 or sum(i.file_size for i in infos) > 20 * 1024 * 1024:
                  raise SystemExit('The source archive exceeds the allowed size.')
              names = {i.filename for i in infos}
              required = {'package.json', 'package-lock.json', 'components/timelens-app.tsx',
                          'components/time-grid.tsx', 'lib/server.ts', 'lib/model.ts',
                          'scripts/configure-cloudflare.mjs', 'DEPLOYMENT.md'}
              if not required.issubset(names):
                  raise SystemExit('The archive is missing required TimeLens source files.')
              for info in infos:
                  p = PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in info.filename or ':' in info.filename:
                      raise SystemExit('Unsafe archive path.')
                  if any(part in blocked for part in p.parts):
                      raise SystemExit('Unexpected private or generated directory in archive.')
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit('Symbolic links are not accepted.')
                  if any(part.startswith('.dev.vars') or (part.startswith('.env') and part != '.env.example') for part in p.parts):
                      raise SystemExit('Environment secrets must not be uploaded.')
                  # These workflows are installed separately through the GitHub integration.
                  # GITHUB_TOKEN does not need permission to modify workflow files.
                  if p.parts and p.parts[0] == '.github':
                      continue
                  target = root.joinpath(*p.parts)
                  target.resolve().relative_to(root)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(info))
          print('TimeLens source extracted. No deployment secrets were imported.')
          PY
      - name: Install and normalize cross-platform lockfile
        run: npm install --include=dev --include=optional --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run model and API tests
        run: npm test
      - name: Build deployable application
        run: npm run build
      - name: Commit verified project source
        shell: bash
        run: |
          git config user.name "TimeLens source import"
          git config user.email "timelens-import@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Import and verify complete TimeLens source"
            git push origin HEAD:main
          fi
      - name: Record verification status
        shell: bash
        run: |
          {
            echo "## TimeLens source import"
            echo "Source extracted, TypeScript checked, tests passed, and application built."
            echo "Production deployment has not been performed."
            echo "Configure Cloudflare repository secrets, then manually run Deploy TimeLens to Cloudflare."
          } >> "$GITHUB_STEP_SUMMARY"
